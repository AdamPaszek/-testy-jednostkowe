name: Node.js CI

on:
  push:
    branches:
      - gh_actions   # Aktywuje workflow tylko na push do gałęzi "gh_actions"
  pull_request:
    branches:
      - main   # Uruchamia workflow, gdy robisz pull request do gałęzi main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x]

    steps:
    - name: Check out the code
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test
